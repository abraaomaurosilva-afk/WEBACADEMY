<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lembretes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      padding: 24px;
      margin-bottom: 24px;
    }
    h1, h2 { margin-top: 0; }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }
    .full { grid-column: 1 / -1; }
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input, textarea, button {
      width: 100%;
      font: inherit;
    }
    input, textarea {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 700;
    }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #64748b; color: white; }
    .danger { background: #dc2626; color: white; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .actions button { width: auto; }
    .lembrete {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }
    .meta {
      color: #64748b;
      font-size: .92rem;
      margin: 6px 0;
    }
    .empty {
      color: #64748b;
      text-align: center;
      padding: 22px 0;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>📝 Lembretes</h1>
      <p>Aplicação simples em TypeScript utilizando <strong>tuplas</strong> para os registros.</p>

      <form id="form-lembrete" class="grid">
        <input type="hidden" id="id-edicao" />

        <div>
          <label for="titulo">Título *</label>
          <input id="titulo" type="text" required placeholder="Ex.: Estudar TypeScript" />
        </div>

        <div>
          <label for="data-limite">Data limite (opcional)</label>
          <input id="data-limite" type="datetime-local" />
        </div>

        <div class="full">
          <label for="descricao">Descrição (opcional)</label>
          <textarea id="descricao" placeholder="Descreva a tarefa ou atividade"></textarea>
        </div>

        <div class="full">
          <button class="primary" type="submit" id="btn-salvar">Adicionar lembrete</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Atividades pendentes</h2>
      <div id="lista-lembretes"></div>
    </section>
  </main>

  <script src="dist/index.js"></script>
</body>
</html>
