<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gerenciar Produtos</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'></head><body><nav class='navbar navbar-expand bg-light border-bottom'><div class='container'><a class='navbar-brand' href='#'>Loja WA</a><div class='navbar-nav'><a class='nav-link' href='index.html'>Início</a><a class='nav-link active' href='produtos.html'>Gerenciar produtos</a></div><a class='btn btn-outline-secondary btn-sm' href='login.html'>Sair</a></div></nav><main class='container py-5'><div class='d-flex justify-content-between align-items-center mb-3'><h1 class='h3 mb-0'>Gerenciar Produtos</h1><button class='btn btn-warning' data-bs-toggle='modal' data-bs-target='#novoProdutoModal'>Novo Produto</button></div><div class='table-responsive'><table class='table table-striped table-hover align-middle'><thead class='table-dark'><tr><th>ID</th><th>Produto</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody><tr><td>1</td><td>Bicicleta</td><td>R$ 1.000,00</td><td>110</td><td><button class='btn btn-secondary btn-sm me-1'>Editar</button><button class='btn btn-danger btn-sm'>Excluir</button></td></tr><tr><td>2</td><td>Echo Dot</td><td>R$ 600,00</td><td>8</td><td><button class='btn btn-secondary btn-sm me-1'>Editar</button><button class='btn btn-danger btn-sm'>Excluir</button></td></tr><tr><td>3</td><td>Celular</td><td>R$ 1.500,00</td><td>10</td><td><button class='btn btn-secondary btn-sm me-1'>Editar</button><button class='btn btn-danger btn-sm'>Excluir</button></td></tr><tr><td>4</td><td>Umidificador</td><td>R$ 100,00</td><td class='text-danger fw-bold'>0</td><td><button class='btn btn-secondary btn-sm me-1'>Editar</button><button class='btn btn-danger btn-sm'>Excluir</button></td></tr></tbody></table></div></main><div class='modal fade' id='novoProdutoModal' tabindex='-1' aria-labelledby='novoProdutoLabel' aria-hidden='true'><div class='modal-dialog modal-dialog-centered'><div class='modal-content'><div class='modal-header'><h2 class='modal-title fs-5' id='novoProdutoLabel'>Novo Produto</h2><button type='button' class='btn-close' data-bs-dismiss='modal' aria-label='Fechar'></button></div><form><div class='modal-body'><div class='mb-3'><label for='produto' class='form-label'>Produto</label><input id='produto' class='form-control' required></div><div class='mb-3'><label for='preco' class='form-label'>Preço</label><input id='preco' type='number' step='0.01' min='0' class='form-control' required></div><div><label for='estoque' class='form-label'>Estoque</label><input id='estoque' type='number' min='0' class='form-control' required></div></div><div class='modal-footer'><button class='btn btn-success w-100' type='submit'>Confirmar cadastro</button></div></form></div></div></div><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script></body></html>
