<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container-fluid"><div class="row min-vh-100"><section class="col-12 col-md-5 bg-light d-flex align-items-center justify-content-center p-5"><div class="text-center"><h1 class="h2">Bem vindo à WA Loja!</h1><p class="text-secondary">Crie sua conta para começar.</p></div></section><section class="col-12 col-md-7 d-flex align-items-center justify-content-center p-4"><form class="w-100" style="max-width:420px"><h2 class="mb-4">Cadastro</h2><div class="mb-3"><label for="nome" class="form-label">Nome</label><input id="nome" class="form-control" required></div><div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" type="email" class="form-control" required></div><div class="mb-3"><label for="confirmarEmail" class="form-label">Confirmar email</label><input id="confirmarEmail" type="email" class="form-control" required></div><div class="mb-3"><label for="senha" class="form-label">Senha</label><input id="senha" type="password" class="form-control" required></div><button class="btn btn-success w-100" type="submit">Confirmar cadastro</button><p class="text-center mt-3 mb-0"><a href="login.html">já possuo cadastro</a></p></form></section></div></main></body></html>
