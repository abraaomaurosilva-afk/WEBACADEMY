<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Loja - Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f8f9fa}
    .card{height:100%}
    .card-img-top{height:210px;object-fit:cover}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Loja WA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <div class="navbar-nav me-auto">
        <a class="nav-link active" href="index.html">Início</a>
        <a class="nav-link" href="produtos.html">Gerenciar produtos</a>
      </div>
      <a class="btn btn-outline-light" href="login.html">Sair</a>
    </div>
  </div>
</nav>

<main class="container py-5">
  <h1 class="h3 mb-4">Produtos</h1>
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm">
        <img src="assets/placeholder.jpg" class="card-img-top" alt="Bicicleta">
        <div class="card-body d-flex flex-column">
          <h2 class="h5">Bicicleta</h2>
          <p class="text-secondary">R$ 1.000,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm">
        <img src="assets/placeholder.jpg" class="card-img-top" alt="Echo Dot">
        <div class="card-body d-flex flex-column">
          <h2 class="h5">Echo Dot</h2>
          <p class="text-secondary">R$ 600,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm">
        <img src="assets/placeholder.jpg" class="card-img-top" alt="Celular">
        <div class="card-body d-flex flex-column">
          <h2 class="h5">Celular</h2>
          <p class="text-secondary">R$ 1.500,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card shadow-sm">
        <img src="assets/placeholder.jpg" class="card-img-top" alt="Umidificador">
        <div class="card-body d-flex flex-column">
          <h2 class="h5">Umidificador</h2>
          <p class="text-secondary">R$ 100,00</p>
          <button class="btn btn-secondary w-100 mt-auto" disabled>Indisponível</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
