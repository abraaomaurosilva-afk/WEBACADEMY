<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja WA - Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .product-card { height:100%; overflow:hidden; transition:transform .2s, box-shadow .2s; }
    .product-card:hover { transform:translateY(-3px); box-shadow:0 .5rem 1rem rgba(0,0,0,.12)!important; }
    .product-img { width:100%; height:220px; object-fit:contain; background:#fff; padding:14px; }
    .price { color:#6c757d; margin-bottom:12px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Loja WA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir navegação"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Gerenciar produtos</a></li>
      </ul>
      <a class="btn btn-outline-light btn-sm" href="#">Sair</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <h2 class="mb-4">Produtos</h2>
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card shadow-sm">
        <img src="assets/bicicleta.jpg" class="card-img-top product-img" alt="Bicicleta">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Bicicleta</h5>
          <p class="price">R$ 1.000,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card shadow-sm">
        <img src="assets/echo-dot.jpg" class="card-img-top product-img" alt="Echo Dot">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Echo Dot</h5>
          <p class="price">R$ 600,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card shadow-sm">
        <img src="assets/celular.jpg" class="card-img-top product-img" alt="Celular">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Celular</h5>
          <p class="price">R$ 1.500,00</p>
          <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card shadow-sm">
        <img src="assets/umidificador.jpg" class="card-img-top product-img" alt="Umidificador">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Umidificador</h5>
          <p class="price">R$ 100,00</p>
          <button class="btn btn-secondary w-100 mt-auto" disabled aria-disabled="true">Indisponível</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
