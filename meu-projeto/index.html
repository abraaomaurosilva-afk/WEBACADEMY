<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards de Produtos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f8f9fa;
    }

    .card {
      height: 100%;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    .card-img-top {
      height: 180px;
      object-fit: contain;
      padding: 25px;
      background-color: white;
    }

    .card-title {
      font-weight: bold;
    }

    .preco {
      color: #555;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <h1 class="text-center mb-4">Produtos</h1>

    <div class="row g-4">

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm">
          <img src="https://placehold.co/600x400/png?text=Bicicleta" class="card-img-top" alt="Bicicleta">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Bicicleta</h5>
            <p class="preco">R$ 1.000,00</p>
            <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm">
          <img src="https://placehold.co/600x400/png?text=Echo+Dot" class="card-img-top" alt="Echo Dot">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Echo Dot</h5>
            <p class="preco">R$ 600,00</p>
            <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm">
          <img src="https://placehold.co/600x400/png?text=Celular" class="card-img-top" alt="Celular">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Celular</h5>
            <p class="preco">R$ 1.500,00</p>
            <button class="btn btn-primary w-100 mt-auto">Adicionar no carrinho</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card shadow-sm">
          <img src="https://placehold.co/600x400/png?text=Umidificador" class="card-img-top" alt="Umidificador">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">Umidificador</h5>
            <p class="preco">R$ 100,00</p>
            <button class="btn btn-secondary w-100 mt-auto" disabled>Indisponível</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
